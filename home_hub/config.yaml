name: Home Hub
version: "1.0.0"
slug: home_hub
description: Family energy dashboard with solar analytics, appliance health, habits, forecasts and alerts.
url: https://github.com/kraythekray/homeassistant-homehub-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Home Hub
homeassistant_api: true
options:
  weather_enabled: true
  backfill_days: 365
schema:
  weather_enabled: bool
  backfill_days: int(30,1095)
  import_price: float?
  export_price: float?
  battery_kwh: float?
  panel_kwp: float?
  notify_service: str?
